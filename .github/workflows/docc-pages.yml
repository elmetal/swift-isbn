name: Deploy DocC to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build DocC archive
        run: |
          xcodebuild docbuild \
            -scheme ISBN \
            -destination 'platform=macOS'

      - name: Convert DocC archive for static hosting
        run: |
          DOCCARCHIVE=$(find ~/Library/Developer/Xcode/DerivedData -type d -name 'ISBN.doccarchive' | head -n 1)
          if [[ -z "${DOCCARCHIVE}" ]]; then
            echo "DocC archive not found."
            exit 1
          fi
          xcrun docc convert "${DOCCARCHIVE}" \
            --output-path "docs" \
            --transform-for-static-hosting \
            --hosting-base-path "${{ github.event.repository.name }}"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
